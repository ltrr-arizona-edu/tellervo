name: Desktop Packaging

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  package:
    name: Package on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            package_type: deb
            artifact_name: tellervo-linux
          - os: windows-latest
            package_type: msi
            artifact_name: tellervo-windows
          - os: macos-latest
            package_type: dmg
            artifact_name: tellervo-macos

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache project Maven repository
        uses: actions/cache@v5
        with:
          path: .mvn-repo
          key: ${{ runner.os }}-maven-${{ hashFiles('pom.xml', 'Libraries/InstallLocalMavenJars.sh', 'Libraries/*.pom', 'Libraries/*.jar') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Seed local Maven repository for bundled jars
        shell: bash
        run: bash Libraries/InstallLocalMavenJars.sh

      - name: Regenerate JAXB sources
        shell: bash
        run: mvn -q -DskipTests generate-sources

      - name: Build application jars
        shell: bash
        run: mvn -q -DskipTests package

      - name: Create desktop package with jpackage
        shell: bash
        run: bash ./scripts/package-desktop.sh --type "${{ matrix.package_type }}" --verbose

      - name: Smoke test Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem -LiteralPath target/jpackage/dist -Filter *.msi | Select-Object -First 1
          if ($null -eq $installer) {
            throw "Windows installer was not created"
          }

          $logPath = Join-Path $env:RUNNER_TEMP "tellervo-msi-install.log"
          $arguments = @(
            "/i",
            "`"$($installer.FullName)`"",
            "/qn",
            "/norestart",
            "/l*v",
            "`"$logPath`""
          )
          $process = Start-Process -FilePath "msiexec.exe" -ArgumentList $arguments -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            if (Test-Path $logPath) {
              Get-Content -LiteralPath $logPath
            }
            throw "Windows installer failed with exit code $($process.ExitCode)"
          }

          $installDir = Join-Path $env:LOCALAPPDATA "Tellervo"
          $launcher = Join-Path $installDir "Tellervo.exe"
          if (-not (Test-Path $launcher -PathType Leaf)) {
            throw "Installed launcher not found: $launcher"
          }

          # File existence alone doesn't prove the serial native library actually loads (this is
          # exactly the class of regression that shipped an RXTX DLL that crashed on open) - so
          # actually initialize jSerialComm's native library from the installed app's own bundled
          # jars. jpackage's app-image runtime is a minimized jlink image with no standalone
          # java.exe/javaw.exe (the app only launches via Tellervo.exe's native launcher), so use
          # the build JDK already on this runner instead - the native-loading code path being
          # tested doesn't depend on which JVM launches it.
          $appDir = Join-Path $installDir "app"
          $smokeTestOutput = & java -cp "$appDir\*" org.tellervo.desktop.nativeloader.SerialLibrarySmokeTest 2>&1
          $smokeTestExitCode = $LASTEXITCODE
          Write-Host $smokeTestOutput
          if ($smokeTestExitCode -ne 0) {
            throw "Serial library smoke test failed (exit code $smokeTestExitCode) against the installed app"
          }
          if (-not ($smokeTestOutput -match "Serial library loaded OK")) {
            throw "Serial library smoke test did not report success"
          }

      - name: Upload Windows installer log
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@v5
        with:
          name: diagnostics-windows-installer-log
          path: ${{ runner.temp }}/tellervo-msi-install.log
          if-no-files-found: warn

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact_name }}
          path: target/jpackage/dist/**
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download desktop packages
        uses: actions/download-artifact@v5
        with:
          pattern: tellervo-*
          path: release-assets
          merge-multiple: true

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 ||
            gh release create "${GITHUB_REF_NAME}" --generate-notes --title "Tellervo ${GITHUB_REF_NAME}"
          gh release upload "${GITHUB_REF_NAME}" release-assets/* --clobber
