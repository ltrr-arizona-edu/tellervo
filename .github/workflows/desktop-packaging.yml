name: Desktop Packaging

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  package:
    name: Package on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            package_type: deb
            artifact_name: tellervo-linux
          - os: windows-latest
            package_type: msi
            artifact_name: tellervo-windows
          - os: macos-latest
            package_type: dmg
            artifact_name: tellervo-macos

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.9

      - name: Seed local Maven repository for bundled jars
        shell: bash
        run: bash Libraries/InstallLocalMavenJars.sh

      - name: Regenerate JAXB sources
        shell: bash
        run: mvn -q -DskipTests generate-sources

      - name: Build application jars
        shell: bash
        run: mvn -q -DskipTests package

      - name: Create desktop package with jpackage
        shell: bash
        run: bash ./scripts/package-desktop.sh --type "${{ matrix.package_type }}" --verbose

      - name: Smoke test Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem -LiteralPath target/jpackage/dist -Filter *.msi | Select-Object -First 1
          if ($null -eq $installer) {
            throw "Windows installer was not created"
          }

          $logPath = Join-Path $env:RUNNER_TEMP "tellervo-msi-install.log"
          $arguments = @(
            "/i",
            "`"$($installer.FullName)`"",
            "/qn",
            "/norestart",
            "/l*v",
            "`"$logPath`""
          )
          $process = Start-Process -FilePath "msiexec.exe" -ArgumentList $arguments -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            if (Test-Path $logPath) {
              Get-Content -LiteralPath $logPath
            }
            throw "Windows installer failed with exit code $($process.ExitCode)"
          }

          $installDir = Join-Path $env:LOCALAPPDATA "Tellervo"
          $launcher = Join-Path $installDir "Tellervo.exe"
          $serialLibrary = Join-Path $installDir "app/rxtxSerial.dll"
          if (-not (Test-Path $launcher -PathType Leaf)) {
            throw "Installed launcher not found: $launcher"
          }
          if (-not (Test-Path $serialLibrary -PathType Leaf)) {
            throw "Installed serial library not found: $serialLibrary"
          }

      - name: Upload Windows installer log
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-windows-installer-log
          path: ${{ runner.temp }}/tellervo-msi-install.log
          if-no-files-found: warn

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: target/jpackage/dist/**
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download desktop packages
        uses: actions/download-artifact@v4
        with:
          pattern: tellervo-*
          path: release-assets
          merge-multiple: true

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 ||
            gh release create "${GITHUB_REF_NAME}" --generate-notes --title "Tellervo ${GITHUB_REF_NAME}"
          gh release upload "${GITHUB_REF_NAME}" release-assets/* --clobber
